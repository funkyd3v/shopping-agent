name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only values; never secrets. Missing/invalid env must fail fast.
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: file:./ci.db
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit; no network / no API keys)
        run: pnpm test

      - name: Build
        run: pnpm build
